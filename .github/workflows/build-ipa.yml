name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Target Folder / Game Name (e.g. PokemonPikachu)'
        required: true
        default: 'PokemonPikachu'
      nsp_base_url:
        description: 'Direct download URL for Base NSP/XCI (can be blank if cached)'
        required: false
      nsp_update_url:
        description: 'Direct download URL for Update NSP (optional)'
        required: false
      nsp_dlc_url:
        description: 'Direct download URL for DLC NSP (optional)'
        required: false

jobs:
  build:
    name: Build IPA on Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout nxnative Repository
        uses: actions/checkout@v4

      - name: Configure Xcode Version
        run: |
          echo "Installed Xcode applications on runner:"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_27.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_27.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          else
            echo "Explicit Xcode 27 path not found. Keeping default runner toolchain."
          fi

          xcodebuild -version

      - name: Download Metal Toolchain Component
        run: |
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install System Build Tools (Homebrew)
        run: |
          brew install xcodegen zstd glslang

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" nsz

      - name: Deploy prod.keys
        env:
          PROD_KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS_CONTENT" > ~/.switch/prod.keys
          echo "$PROD_KEYS_CONTENT" > ./prod.keys
          
          if [ ! -s ./prod.keys ]; then
            echo "ERROR: PROD_KEYS secret is empty or missing in repository settings!"
            exit 1
          fi

      - name: Restore Cached Game NSPs
        id: cache-nsp
        uses: actions/cache@v4
        with:
          path: games_input/${{ github.event.inputs.game_name }}
          key: nsp-${{ github.event.inputs.game_name }}

      - name: Download Game Rom Files
        if: steps.cache-nsp.outputs.cache-hit != 'true'
        run: |
          if [ -z "${{ github.event.inputs.nsp_base_url }}" ]; then
            echo "ERROR: No cache found for 'nsp-${{ github.event.inputs.game_name }}' and no nsp_base_url was provided."
            exit 1
          fi

          GAME_DIR="games_input/${{ github.event.inputs.game_name }}"
          mkdir -p "$GAME_DIR"
          cd "$GAME_DIR"

          echo "Downloading Base NSP..."
          curl -L -o "base_game.nsp" "${{ github.event.inputs.nsp_base_url }}"

          if [ -n "${{ github.event.inputs.nsp_update_url }}" ]; then
            echo "Downloading Update NSP..."
            curl -L -o "update.nsp" "${{ github.event.inputs.nsp_update_url }}"
          fi

          if [ -n "${{ github.event.inputs.nsp_dlc_url }}" ]; then
            echo "Downloading DLC NSP..."
            curl -L -o "dlc.nsp" "${{ github.event.inputs.nsp_dlc_url }}"
          fi

          ls -lh

      - name: Run nxnative Build Pipeline
        run: |
          python3 scripts/build_ipa_from_nsp.py \
            -k ./prod.keys \
            --allow-other-metal \
            "games_input/${{ github.event.inputs.game_name }}"

      - name: Locate and Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.game_name }}-IPA
          path: |
            *.ipa
            **/*.ipa
          retention-days: 2
          if-no-files-found: error
